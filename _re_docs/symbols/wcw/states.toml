# Action-state handlers: g_state_handlers[Wrestler.state] (120 entries, 0x00-0x77).
# Generated from the table, then edited by hand. Most entries are 0x28-byte wrappers
# that call one body function; shared handlers list every state they serve.
# Name format: state_XX_role (wrapper) and state_XX_role_body; plain state_XX = role unknown.

