# Controller input as the match logic sees it.

[[func]]
addr = 0x800B4C38
name = "input_remap"
proto = "void input_remap(s16 pad, u16 *buttons)"
desc = "Button configuration: keeps Start and the d-pad, and maps 7 game actions (A grapple, B strike, C-down, R, L, C-up, C-right bits) from the physical buttons chosen per pad at 0x80061FF8 (1 A, 2 B, 3 L, 4 R, 5 Z, 7 C-up, 8 C-down, 9 C-left, 10 C-right)."
status = "confirmed"

[[data]]
addr = 0x80047B20
name = "g_pads"
type = "struct Pad[4]"
desc = "Controller state per port (12 bytes each)."
status = "likely"

[[data]]
addr = 0x80061848
name = "g_slot_pad"
type = "s32[4]"
desc = "Controller assigned to each wrestler slot: pad index + 1, or 0 for none."
status = "confirmed"

[[data]]
addr = 0x800F16B2
name = "g_input_held"
type = "u16"
desc = "Buttons held by the wrestler being updated (pad or AI)."
status = "confirmed"

[[data]]
addr = 0x800F16B4
name = "g_input_pressed"
type = "u16"
desc = "Buttons pressed by the wrestler being updated (pad or AI)."
status = "likely"

[[data]]
addr = 0x800F16B1
name = "g_input_far"
type = "s8"
desc = "1 when the stick is pushed past 41 on either axis (pad) or as set by the AI."
status = "confirmed"

[[enum]]
name = "N64Button"
desc = "Standard N64 controller button bits."
values = { A = 0x8000, B = 0x4000, Z = 0x2000, START = 0x1000, D_UP = 0x800, D_DOWN = 0x400, D_LEFT = 0x200, D_RIGHT = 0x100, L = 0x20, R = 0x10, C_UP = 0x8, C_DOWN = 0x4, C_LEFT = 0x2, C_RIGHT = 0x1 }

# Input handlers tried in order by state_01_stand. Each returns nonzero when it started an action.

[[func]]
addr = 0x800B9DA0
name = "input_run"
proto = "s32 input_run(struct Wrestler *w, struct Wrestler *opp, u16 held)"
desc = "C-down with a direction: starts running (state 0x03)."
status = "likely"

[[func]]
addr = 0x800BA1E8
name = "input_climb_turnbuckle"
proto = "s32 input_climb_turnbuckle(struct Wrestler *w, u16 pressed, u16 held, u16 dir)"
desc = "C-down handler that enters state 0x09 (FAQ: C-down toward a corner climbs the turnbuckle)."
status = "guess"

[[func]]
addr = 0x800B9A94
name = "input_cup_ropes"
proto = "s32 input_cup_ropes(struct Wrestler *w, u16 held, u16 pressed, u16 dir)"
desc = "C-up handler entering states 0x54/0x55 (FAQ: C-up climbs into or out of the ring)."
status = "guess"

[[func]]
addr = 0x800D84A4
name = "input_crowd_weapon"
proto = "s32 input_crowd_weapon(struct Wrestler *w, u16 held, u16 pressed, u16 dir)"
desc = "On the floor, C-up with the d-pad toward the barrier and no weapon held: state 0x6F (ask the crowd for a weapon). Not the tag, which goes through input_cup_ropes."
status = "confirmed"

[[func]]
addr = 0x800BA448
name = "input_strike"
proto = "s32 input_strike(struct Wrestler *w, struct Wrestler *opp, u16 held, void *ctx)"
desc = "B: strike (state 0x1D), or a ground attack on a downed opponent (0x23 / 0x4E)."
status = "likely"

[[func]]
addr = 0x800BA850
name = "input_grapple"
proto = "s32 input_grapple(struct Wrestler *w, struct Wrestler *opp, u16 held, void *ctx)"
desc = "A: grapple attempt (state 0x3D), or 0x1D in some positions."
status = "likely"

[[func]]
addr = 0x800BAC04
name = "input_l"
proto = "s32 input_l(struct Wrestler *w, struct Wrestler *opp, u16 held, void *ctx)"
desc = "L handler: enters 0x18 or 0x53 (FAQ: L avoids a grapple; drags a downed opponent)."
status = "guess"

[[func]]
addr = 0x800BADA4
name = "input_cup_opponent"
proto = "s32 input_cup_opponent(struct Wrestler *w, struct Wrestler *opp, u16 held, void *ctx)"
desc = "C-up handler near the opponent: enters 0x29 / 0x2B / 0x2C / 0x53 (FAQ: C-up flips a downed opponent over)."
status = "guess"

[[func]]
addr = 0x800B9FE8
name = "input_r"
proto = "s32 input_r(struct Wrestler *w, struct Wrestler *opp, u16 held, u16 pressed)"
desc = "R handler: block (0x39), pick up a downed opponent (0x2D/0x2E), or 0x08."
status = "likely"

[[func]]
addr = 0x800B93F0
name = "input_apron_moves"
proto = "s32 input_apron_moves(struct Wrestler *w, struct Wrestler *opp, u16 held, u16 pressed)"
desc = "Enters states 0x58 / 0x59 / 0x5B (slingshot and springboard moves, slots 175-179)."
status = "guess"

[[func]]
addr = 0x800BB134
name = "input_move"
proto = "void input_move(struct Wrestler *w, s8 far)"
desc = "Last handler of state_01_stand: when the analog stick is pressed (g_input_far) starts the taunt, state 0x16. Walking itself is done earlier by walk_step."
status = "likely"

[[func]]
addr = 0x800A61E0
name = "input_switch_target"
proto = "s32 input_switch_target(struct Wrestler *w, u16 held, u16 pressed)"
desc = "Tests C-right, which the FAQ lists as changing which opponent you focus on."
status = "guess"
