# Move sets and move records (ovl_b).
# Notes: _re_docs/individual_games/wcw_world_tour/moves.md

[[func]]
addr = 0x800A2400
name = "wrestler_move_anim"
proto = "s16 wrestler_move_anim(struct Wrestler *w, s16 part)"
desc = "Animation for part (0 attacker, 1 receiver, ...) of w's current move: g_moveset_anims[moveset][g_move_anim_first[move_slot] + part] + 0xD82."
status = "confirmed"

[[func]]
addr = 0x800A63F8
name = "wrestler_set_move"
proto = "void wrestler_set_move(struct Wrestler *w, s8 moveset, s16 slot)"
desc = "Selects move slot from a move set and unpacks its record into w->move."
status = "confirmed"

[[func]]
addr = 0x800A649C
name = "wrestler_set_move_from"
proto = "void wrestler_set_move_from(struct Wrestler *w, struct Wrestler *src, s16 slot)"
desc = "Like wrestler_set_move but takes the move set from src->slot."
status = "likely"

[[func]]
addr = 0x800A6514
name = "move_record_unpack"
proto = "void move_record_unpack(struct MoveParams *dst, u32 *packed)"
desc = "Unpacks a 24-byte bit-packed move record into MoveParams."
status = "confirmed"

[[func]]
addr = 0x8009DF20
name = "move_apply_hit"
proto = "void move_apply_hit(struct Wrestler *a, struct Wrestler *b, struct Wrestler *c)"
desc = "Called by the attacker when move_frames_left reaches 1, with (self, self, opponent); probably applies damage/effects."
status = "confirmed"

[[data]]
addr = 0x800E7BD0
name = "g_move_anim_first"
type = "s16[222]"
desc = "Index of each move slot's first entry in the animation list."
status = "confirmed"

[[data]]
addr = 0x800F1D60
name = "g_moveset_hdr"
type = "u8[4][0x20]"
desc = "Move-set file 0 (header) per wrestler slot."
status = "confirmed"

[[data]]
addr = 0x800F1DE0
name = "g_moveset_x60"
type = "u8[4][0x60]"
desc = "Move-set file 3 (0x60-byte block) per wrestler slot."
status = "confirmed"

[[data]]
addr = 0x800F1F60
name = "g_moveset_anims"
type = "u8[4][0x4D0]"
desc = "Move-set file 2 (animation lists) per slot, after an 8-byte gap."
status = "confirmed"

[[data]]
addr = 0x800F32A0
name = "g_moveset_moves"
type = "u8[4][0x14D8]"
desc = "Move-set file 1 (222 x 24-byte move records) per slot, after an 8-byte gap."
status = "confirmed"

[[data]]
addr = 0x800F8600
name = "g_global_moves"
desc = "File 221 loaded at +8: 42 generic move records (24 bytes, same packing as move sets) used by wrestler_set_move_from for crashes, block spirit (2/3: power 0), pins, ropes and the like."
status = "confirmed"

[[func]]
addr = 0x800C6DFC
name = "grapple_choose_move"
proto = "void grapple_choose_move(struct Wrestler *atk, struct Wrestler *def, u16 buttons)"
desc = "Turns grapple input into a move: picks the move-set slot from grapple_ctx, buttons and d-pad (g_grapple_slots), or a state pair (Irish whip, rear carry, ...); then counts stats and checks for a reversal."
status = "confirmed"
notes = "Front: slot = g_grapple_slots[6*strong + 3*(B) + dir(0 none,1 up,2 down)]. Rear: g_grapple_slots[12 + 4*strong + 2*(B) + (any dir)]. Corner: 83 / 88 / 93 (up) / 98 (down). Special: 58 front, 69 rear. C-down = Irish whip (states 10/11; 12/13 or 14/15 in the DEF_ON_APRON/ATK_ON_APRON contexts, which also use slots 105/106 for A/B). Rear grapple + R = states 102/103 (FAQ: put the opponent on your shoulders), rear + L = 100/101. Strong front B with header.traits & 1 = states 68/69. If the move can't be done (move.flags & 0x3000), falls back to states 70/71 or slot+5."

[[func]]
addr = 0x800C7680
name = "grapple_check_reversal"
proto = "s32 grapple_check_reversal(struct Wrestler *atk, struct Wrestler *def)"
desc = "If def has CAN_REVERSE and the move is reversible (move.flags & 1), gives def its counter move (reversal_variant, or slots 70/71 rear, 185/186 turnbuckle) and sets def REVERSING."
status = "likely"

[[func]]
addr = 0x800A7750
name = "reversal_variant"
proto = "s16 reversal_variant(struct Wrestler *atk, struct Wrestler *def)"
desc = "Counter slot = atk->move_slot + 1..4, where the variant is 2 bits per global move id in the defender's move-set file 3 (g_moveset_x60). A debug override picks it from the d-pad while Z is held."
status = "confirmed"
notes = "This is why grapple moves (except weak A) occupy 5 consecutive slots: the move and its 4 reversal variants."

[[func]]
addr = 0x800A6808
name = "move_count_stats"
proto = "void move_count_stats(struct Wrestler *atk, struct Wrestler *def, s16 category)"
desc = "Maps the attacker's move slot to statistic categories for both sides (stat_category), and increments g_move_stats[wrestler][category]."
status = "confirmed"

[[data]]
addr = 0x800E7920
name = "g_grapple_slots"
type = "s16[20]"
desc = "Grapple slot table: front weak A {0,1,2} weak B {3,8,13} strong A {18,23,28} strong B {33,38,43}; rear weak {61,62,63,64} strong {65,66,67,68}."
status = "confirmed"

[[data]]
addr = 0x80061890
name = "g_move_stats"
type = "u32[4][116]"
desc = "Per wrestler: 58 categories x 2 words; word 0 counts moves of that category (-1 = not tracked)."
status = "likely"

# --- grapple flow; see individual_games/wcw_world_tour/grapples.md ---

[[func]]
addr = 0x800C4054
name = "grapple_lock_attacker"
proto = "s16 grapple_lock_attacker(struct Wrestler *w, struct Wrestler *def)"
desc = "Lock-up: while state_timer < the lock frames (6, 10 test of strength) slides by slide_vel and turns by turn_step; then sets the facing and opens the input window in state_timer: 60 weak, 90 strong, 60 apron/ropes, 30 if the defender is SPECIAL (the 0x40000 context jumps to step 7)."
status = "confirmed"

[[func]]
addr = 0x800C45E8
name = "grapple_lock_defender"
proto = "s16 grapple_lock_defender(struct Wrestler *w, struct Wrestler *atk)"
desc = "Defender side of the lock-up: turns by turn_step (and slides only across the ropes) until its lock frames pass, then sets its facing."
status = "confirmed"

[[func]]
addr = 0x800C78B0
name = "grapple_defender_input"
proto = "void grapple_defender_input(struct Wrestler *w, struct Wrestler *atk, u16 pressed)"
desc = "The defender's single reversal try: the first A/B/L/R press sets flags_lo 0x200000 and, if chance_roll(w, 0) wins (spirit table: 100 -> 500, 81 -> 333, 61 -> 250, 31 -> 125, 11 -> 62, else 31), CAN_REVERSE. Not allowed when only the attacker is SPECIAL. Debug: 0x800F16E0 & 1 with Z held grants it."
status = "confirmed"

[[func]]
addr = 0x8009EBF0
name = "chance_roll"
proto = "s16 chance_roll(struct Wrestler *w, struct Wrestler *other, s16 kind)"
desc = "Computes a chance (capped at 1000) for one of ~15 situations from spirit, health or move fields (tables at 0x800E6D60-0x800E6ED2) and rolls it with sub_800A0410. Kind 0 = grapple reversal by spirit."
status = "confirmed"

[[func]]
addr = 0x800A039C
name = "rand_pool_next"
desc = "Bays-Durham shuffle: returns g_rand_pool[rng_main() & 31] (0..999) and refills that slot with rng_match."
status = "likely"

[[data]]
addr = 0x800F06D0
name = "g_grapple_input"
type = "u16[4]"
desc = "Per slot: the button (A/B/C-down, or L/R from behind) pressed in the grapple window, ORed with the held d-pad bits; read by grapple_choose_move."
status = "confirmed"

[[func]]
addr = 0x800C5C7C
name = "grapple_reach_anim"
proto = "void grapple_reach_anim(struct Wrestler *w, struct Wrestler *opp, u16 buttons, s32 angle_to_opp)"
desc = "Starts the grab reach: 3365 from the apron (ctx APRON_REACH), runner catch (ctx CATCH_RUNNER, move slot 78/79, +2 strong) when the opponent is RUNNING with run_flags & 0x120, 2956 from the floor into the ring, else 2933 strong / 2932 weak."
status = "confirmed"

[[func]]
addr = 0x800C5210
name = "grapple_contact"
proto = "s8 grapple_contact(struct Wrestler *w)"
desc = "During the reach animation's active window: index of a wrestler whose pelvis is within 30 of a hand (45 from the floor into the ring) or within 56 of a point ahead; 85 from the pelvis for a runner catch. -1 if none."
status = "likely"

[[func]]
addr = 0x800C2A00
name = "grapple_connect"
proto = "s32 grapple_connect(struct Wrestler *atk, struct Wrestler *def)"
desc = "Decides what a connected grab becomes: REAR, turnbuckle pull-down (0x6D/0x6E), runner catch (0x48/0x49), parry by a dodging defender, MUTUAL lock-up, test of strength (both reaching, both health >= 151), floor-to-apron/ring (0x6B/0x6C) or a normal lock-up via grapple_lock."
status = "confirmed"

[[func]]
addr = 0x800C3228
name = "grapple_lock"
proto = "void grapple_lock(struct Wrestler *atk, struct Wrestler *def)"
desc = "Sets the lock-up context (CORNER after a whip into the corner, ATK_ON_APRON / DEF_ON_APRON dropping STRONG, else HOLD), puts the pair in states 0x3E/0x3F (0x40/0x41, 0x64/0x65 or 0x6B/0x6C for the special cases) and links them."
status = "confirmed"

[[func]]
addr = 0x8009FEEC
name = "relative_facing"
proto = "u16 relative_facing(struct Wrestler *a, struct Wrestler *b)"
desc = "Bits: 1 = a faces b (within +-90 deg), 2 = a faces away; 4 = b faces a, 8 = b faces away from a (so a is behind b). grapple_connect sets REAR from bit 8."
status = "confirmed"

[[func]]
addr = 0x800C3798
name = "double_team_check"
proto = "void double_team_check(struct Wrestler *atk, struct Wrestler *def)"
desc = "If def is already held in a normal lock-up (state 0x3F, HOLD) whose window has run under 11 frames, and both attackers are in the same place (ring or floor) and the new one is not on the apron, starts a double team: 0x100 both in front, 0x200 both behind, 0x400 one of each."
status = "confirmed"

[[func]]
addr = 0x800C399C
name = "double_team_start"
proto = "void double_team_start(struct Wrestler *first, struct Wrestler *second, struct Wrestler *def, u16 kind)"
desc = "Puts the trio in states 0x68 (leader), 0x69 (helper), 0x6A (receiver), marks which side each attacker stands on (ctx 0x800 / 0x1000), copies the kind and STRONG into the leader's grapple_ctx and links all three."
status = "confirmed"

[[func]]
addr = 0x800C4964
name = "double_team_place"
proto = "void double_team_place(struct Wrestler *w, struct Wrestler *def, f32 *spot)"
desc = "Picks a double-team attacker's spot relative to the receiver's pelvis and facing (front (+-50, 80), behind (+-50, -80), mixed (0, +-80)) and its facing, and starts a 10-frame slide and turn to it."
status = "confirmed"

# --- strikes and blocking (strikes.md, 2026-10-30) ---

[[func]]
addr = 0x800C98B8
name = "strike_hit_test"
proto = "s8 strike_hit_test(struct Wrestler *att, s16 mode)"
desc = "During the animation window: candidates from strike_targets, same-area rule, pelvis distance < 175, then each hit joint's point(s) within r_target + r_att of the target's pelvis or head (x/z only). Returns the wrestler hit or -1. Mode 3: weapon tip."
status = "confirmed"

[[func]]
addr = 0x800CA318
name = "strike_targets"
proto = "void strike_targets(struct Wrestler *att, s16 mode, s8 out[4])"
desc = "Lists wrestlers that can be hit / grabbed in this mode (flag masks per mode), current opponent first; mode 0 (grapples) skips the tag partner."
status = "likely"

[[func]]
addr = 0x800CA9B0
name = "strike_land"
proto = "void strike_land(struct Wrestler *att, struct Wrestler *def, u32 kind)"
desc = "Applies a strike: breaks up pins and holds, block / block counter / 0x3A, else sets def.hit_info (kind, back, height), damage, aftermath, and picks flinch / stagger / knockdown from weighted tables by hits_taken and health bracket; state 0x24."
status = "confirmed"

[[func]]
addr = 0x800CB694
name = "block_counter"
proto = "s32 block_counter(struct Wrestler *blocker, struct Wrestler *att)"
desc = "Just-frame block: if the block began <= 0x800E7950[header 0x18/0x19] frames ago (3 or 0; frame 3 = 50%), links both and sends them to states 0x51/0x52 (0x6B/0x6C for slot 131). Returns non-zero when caught."
status = "confirmed"

[[func]]
addr = 0x800C9680
name = "joint_radii_init"
proto = "void joint_radii_init(struct Wrestler *w)"
desc = "Fills g_joint_radii for a wrestler from each joint's mesh x/z extent times the per-joint factor at 0x800E7958."
status = "likely"

[[func]]
addr = 0x8009FE04
name = "xz_within"
proto = "s32 xz_within(f32 *a, f32 *b, f32 r, f32 *angle_out)"
desc = "Horizontal distance test through vec_xz_dist_angle (true when closer than r, as used by the hit tests)."
status = "likely"

[[data]]
addr = 0x800F1A20
name = "g_joint_radii"
type = "f32[4][23]"
desc = "Per-wrestler collision radius of each joint (1-19 used): pelvis 28.9, head 13.5 (19.5 for Nash), hand 11."
status = "confirmed"

[[data]]
addr = 0x800E79BC
name = "g_tap_reaction_weights"
type = "s16[4][4][2]"
desc = "Tap strike flinch / stagger weights out of 1000 by hits in a row (1-4) and health bracket (>=128, >=64, >=32, else; thresholds at 0x800E79B4)."
status = "confirmed"

[[func]]
addr = 0x800BA694
name = "strike_across_ropes"
proto = "void strike_across_ropes(struct Wrestler *w, struct Wrestler *opp, u16 dpad, void *ctx)"
desc = "Picks a strike between areas: opponent in the ring -> state 0x1A (slot 130), on the floor -> 0x1B (131), on the apron -> 0x1C (132/133 by facing); d-pad vs ring-zone tables 0x800E7070/0x800E7078 can force 0x1A/0x1B."
status = "likely"

[[data]]
addr = 0x800F0720
name = "g_opp_angle"
type = "s32"
desc = "Angle from the updating wrestler to its opponent (x/z), set each update by wrestler_update."
status = "confirmed"

[[data]]
addr = 0x800F0724
name = "g_opp_dist"
type = "f32"
desc = "x/z distance from the updating wrestler's pelvis to its opponent's; > 95 picks the far tap strike."
status = "confirmed"

# --- knockdowns (knockdown.md, 2026-10-30) ---

[[func]]
addr = 0x800A7944
name = "wrestler_neutral_by_pose"
proto = "void wrestler_neutral_by_pose(struct Wrestler *w)"
desc = "After a move: picks the next state from the animation's pose class (0/1 recover, 2 -> 0x2A, 3 dazed, 4/5 stand, 7-0x1C down face up (odd) / face down (even)); AnimPlayer +6 == 5 -> corner slump 0x13."
status = "confirmed"

[[func]]
addr = 0x800BC460
name = "wait_for_diver"
proto = "s32 wait_for_diver(struct Wrestler *w)"
desc = "True (and marks the diver's dive_flags 0x10) when a wrestler targeting w is in a top-rope dive (states 0x5D-0x5F, steps 2-3); keeps w lying down."
status = "likely"

[[func]]
addr = 0x800BBFC4
name = "get_up_anim"
proto = "s16 get_up_anim(struct Wrestler *w)"
desc = "Get-up animation: SPECIAL 3060/3061 (-2 with trait 0x40000), else 3043 + speed (g_last_damage >= 15 / >= 22, or health_eff < 128 / < 64), +6 face down."
status = "confirmed"

[[func]]
addr = 0x800DD200
name = "wrestler_may_act"
proto = "s32 wrestler_may_act(struct Wrestler *w)"
desc = "Whether a wrestler may attack: singles, rule 0x40 (no tagging), legal, teammate flags_hi 0x800, or a legal wrestler on the floor."
status = "confirmed"

[[func]]
addr = 0x800A7300
name = "move_followup"
proto = "s32 move_followup(struct Wrestler *att, struct Wrestler *def)"
desc = "After a grapple move: pose class 5 -> rear grapple (0x3E/0x3F); move flags 0x3C00 -> pin 0x37/0x38 (0x400) or hold 0x35/0x36; next_slot 123/124 -> strong strike, 136-144 -> 0x51/0x52, else the chained move as 0x4C/0x4D. Returns 0 when nothing follows."
status = "confirmed"

[[func]]
addr = 0x800A483C
name = "pair_follow"
desc = "Keeps a linked receiver snapped to its attacker during a move (tolerance in the last argument)."
status = "likely"
