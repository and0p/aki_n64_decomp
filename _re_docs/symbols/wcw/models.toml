desc = "Parent joint; 0 = none, and those joints carry a position in the animation."
status = "confirmed"

[[data]]
addr = 0x8002DE31
name = "g_bone_part"
type = "s8[19]"
desc = "Bone 1-19 -> index into the body part list and the costume record; -1 for the two head bones."
status = "confirmed"

[[data]]
addr = 0x8002E500
name = "g_body_parts"
type = "u16 *[]"
desc = "Per body type: 19 mesh file numbers (17 bones + 2 extras on the feet)."
status = "confirmed"

[[data]]
addr = 0x8002F150
name = "g_head_tables"
type = "u16 **[6]"
desc = "Per roster group -> per wrestler -> head variants: 11 u16 (2-3 mesh files, texture/palette pairs, face texture)."
