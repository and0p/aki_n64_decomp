# Wrestler models, skeleton posing and animation streaming (main segment).
# Notes: _re_docs/file_formats/wrestler_models.md and _re_docs/file_formats/animations.md
# Tool: tools/rom/wcw_models.py

[[func]]
addr = 0x800095C0
name = "anim_headers_load"
proto = "void anim_headers_load(void)"
desc = "DMAs the first 4 bytes (header word) of each of the 2598 animation files into g_anim_headers."
status = "confirmed"

[[func]]
addr = 0x80009678
name = "anim_frame_count"
proto = "s16 anim_frame_count(s16 anim_id)"
desc = "Frame count of an animation: low 16 bits of its header word."
status = "confirmed"

[[func]]
addr = 0x800096F4
name = "anim_pose_class"
proto = "s16 anim_pose_class(s16 anim_id)"
desc = "Pose class of an animation: header bits 26-30 (copied to Wrestler.pose every frame)."
status = "confirmed"

[[func]]
addr = 0x8000992C
name = "models_init"
proto = "void models_init(void)"
desc = "Match start: allocates g_anim_headers and four 0x6880-byte animation stream buffers, loads headers and file 618, builds the inverse bind matrices from g_bind_xy."
status = "confirmed"

[[func]]
addr = 0x80009D00
name = "model_animate"
desc = "Per-frame skeleton update for one wrestler model: switches animation, decodes or interpolates the frame, blends from the previous animation, builds the skin matrices and the world joint positions."
status = "likely"
notes = "Odd frames interpolate (model_decode_frame_interp), even frames decode a keyframe (model_decode_frame). set_anim flag (0x800F0640[slot]): bit 0 shifts pos so the new animation's pelvis xz lands where the old one was; bit 1 blends the first 5 frames from the previous pose (weights 0.75/0.6/0.45/0.3/0.15 at 0x8002D410). Joint 5 (head) is aimed at a look-at target when one is passed (from sub_800A13A4, 0x800F0658 + slot*12)."

[[func]]
addr = 0x8000A42C
name = "anim_stream_open"
proto = "void anim_stream_open(s16 slot, u16 anim_id)"
desc = "Starts streaming an animation file (always stored raw) into the slot's ring buffer: DMAs the first 128 bytes after the 4-byte header."
status = "confirmed"

[[func]]
addr = 0x8000A500
name = "anim_stream_next"
proto = "void anim_stream_next(s16 slot)"
desc = "Queues a PI DMA of the next 128 bytes of the slot's animation file."
status = "confirmed"

[[func]]
addr = 0x8000A2E0
name = "anim_stream_seek"
proto = "void anim_stream_seek(s16 slot, s16 anim_id, s16 frame)"
desc = "Points the slot's read pointer at keyframe frame/2 (98 bytes each), clamped to the frame count."
status = "confirmed"

[[func]]
addr = 0x8000A5C4
name = "model_build_skin"
proto = "void model_build_skin(s16 slot)"
desc = "Walks the joints in g_joint_order: child position = parent position + (bind offset) * parent rotation, then joint matrix = rotation + position, skin matrix = inverse bind * joint matrix into the render node."
status = "confirmed"

[[func]]
addr = 0x8000A7F0
name = "model_blend_prev"
proto = "void model_blend_prev(s16 slot, s16 frame, u8 flags)"
desc = "Blends the new animation's first frames toward the previous pose (weights at 0x8002D410)."
status = "likely"

[[func]]
addr = 0x8000ABA0
name = "model_decode_frame"
proto = "void model_decode_frame(s16 slot)"
desc = "Decodes one keyframe (19 joints) from the stream into the slot's joint records."
status = "confirmed"

[[func]]
addr = 0x8000AC80
name = "model_decode_frame_interp"
proto = "void model_decode_frame_interp(s16 slot, s16 phase)"
desc = "Odd frame: decodes the next keyframe into a temp buffer and moves each joint halfway to it (angles by the shortest arc)."
status = "confirmed"

[[func]]
addr = 0x8000AF78
name = "anim_decode_joint"
proto = "u8 *anim_decode_joint(u8 *src, f32 *rot, f32 *pos)"
desc = "Decodes one joint: u32 with three 10-bit angles (x 360/1024 deg); bit 31 adds a position, absolute (bit 30 clear, 4 bytes 11/11/10-bit sign-magnitude) or delta from the last absolute one (bit 30 set, 3 sign-magnitude bytes x 0.5). Returns the next src."
status = "confirmed"

[[func]]
addr = 0x8000B1B0
name = "anim_frame_events"
proto = "void anim_frame_events(s16 slot, s16 frame)"
desc = "Fires the 8 (frame, event) byte pairs at file 618 bytes 16-31 whose frame matches: 1-189 sound events, 190-199 the wrestler's own calls, 200-219 rope deflections, 220-243 limbs grabbing / releasing ropes."
status = "confirmed"

[[func]]
addr = 0x80008BD0
name = "mtx_rotate_xyz"
proto = "void mtx_rotate_xyz(f32 *m, f32 ax, f32 ay, f32 az)"
desc = "Row-vector rotation matrix from three Euler angles in degrees (the joint angle convention of the animations)."
status = "confirmed"

[[func]]
addr = 0x8000BB8C
name = "model_build_nodes"
proto = "void model_build_nodes(s16 slot)"
desc = "Loads the 22 mesh parts of a wrestler's costume into render nodes 1-22 (body list by body type, head parts by head variant) and sets up the seam vertices that follow a neighbouring bone."
status = "confirmed"

[[func]]
addr = 0x8000BF70
name = "model_load_textures"
proto = "void model_load_textures(s16 slot, s16 half)"
desc = "Loads texture and palette per node from the costume record (half 0: nodes 1-12 plus head, half 1: nodes 13-22)."
status = "confirmed"

[[func]]
addr = 0x8000C854
name = "model_load"
proto = "void model_load(s16 slot, s16 roster_entry, s16 costume, s16 unused)"
desc = "Loads a wrestler model for a slot: clears nodes, builds nodes, textures, joint positions and scale."
status = "confirmed"

[[func]]
addr = 0x80005D20
name = "mesh_load"
proto = "void mesh_load(void *part, u16 file)"
desc = "Loads a mesh part file and converts it: 8-byte vertices to N64 Vtx, triangle index triples to G_TRI2/G_TRI1 commands."
status = "confirmed"

[[func]]
addr = 0x80005C14
name = "mesh_build_vtx"
proto = "u8 *mesh_build_vtx(void *out, u8 *file)"
desc = "Vertex conversion: pos = (s8 + header offset*16) * (scale+1), s/t = 32 * (u8 + 16*nibble) + 8, normal bytes copied, alpha 0xFF."
status = "confirmed"

[[func]]
addr = 0x80005AE0
name = "mesh_build_tris"
proto = "u32 *mesh_build_tris(void *part, u8 *file)"
desc = "Packs triangle index triples into G_TRI2 (0xB1) pairs plus a trailing G_TRI1."
status = "confirmed"

[[func]]
addr = 0x80006630
name = "mesh_split_seam"
proto = "void mesh_split_seam(void *node, void *part, void *node_b, void *node_a)"
desc = "Seam skinning: the first header[3]>>4 vertices load with node_a's matrix, the next header[3]&15 with node_b's, the rest with the part's own node."
status = "confirmed"

[[data]]
addr = 0x80047BD8
name = "g_anim_stream_buf"
type = "u8 *[4]"
desc = "Per-slot 0x6880-byte ring buffers that animation files stream into."
status = "confirmed"

[[data]]
addr = 0x80047BE8
name = "g_anim_stream"
type = "u8[4][0x8C]"
desc = "Per-slot animation stream state: +0x04 read ptr, +0x08 ROM ptr, +0x0C buffer write ptr, +0x10 bytes left, +0x14 anim id, +0x16 frame, +0x18 scale matrix."
status = "likely"

[[data]]
addr = 0x80047E20
name = "g_model_joints"
type = "u8[4][23][0x7C]"
desc = "Per-slot joint records (0x7C each): +0x00 rotation (3 f32 degrees), +0x0C position, +0x48/+0x60 world positions used for collision."
status = "likely"

[[data]]
addr = 0x8004B8C0
name = "g_model_nodes"
type = "u8[4][23][0xDC]"
desc = "Per-slot render nodes (0xDC each); node n draws the mesh part of bone n, nodes 20-22 are extras on bones 5, 8 and 15. Skin matrix at +0x1C."
status = "likely"

[[data]]
addr = 0x800507D0
name = "g_mesh_parts"
type = "u8[4][23][0x28]"
desc = "Per-slot loaded mesh part records: +1 tri count, +2 vertex count, +4/+5 seam counts, +0xC Vtx, +0x10 setup DL, +0x14 tri DL, +0x18 texture, +0x1C palette."
status = "likely"

[[data]]
addr = 0x8002D3A0
name = "g_bind_xy"
type = "s8[20][2]"
desc = "Bind pose (x, y) of joints 0-19, z = 0. Mesh vertices are in this pose."
status = "confirmed"

[[data]]
addr = 0x8002D3C9
name = "g_joint_order"
type = "u8[19]"
desc = "Joint evaluation order, parents first."
status = "confirmed"

[[data]]
addr = 0x8002D3DC
name = "g_joint_parent"
