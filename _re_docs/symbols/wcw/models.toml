status = "confirmed"

[[data]]
addr = 0x800574B0
name = "g_model_roster"
type = "s16[4]"
desc = "Roster entry loaded in each model slot (group << 8 | index + 1)."
status = "confirmed"

[[data]]
addr = 0x800574D0
name = "g_model_costume"
type = "s16[4]"
desc = "Costume loaded in each model slot."
status = "confirmed"

# --- animation pickers (ovl_b); see individual_games/wcw_world_tour/animation_states.md ---

[[func]]
addr = 0x800A1EEC
name = "wrestler_base_anim"
proto = "s16 wrestler_base_anim(struct Wrestler *w, s16 kind, f32 dist)"
desc = "Picks a basic animation: kind 0 walk, 1 idle, 2 block, 3-8 block hit variants. Style 0-3 from header traits bits 2-5; injured idle/walk by body region when its condition is below 26; 2928/2929 when dist > 355."
status = "likely"
notes = "Tables at 0x800E6F40: walk[4] 2911-2914, idle[4] 2901-2904, injured walk[4] 2918/2919/2921/2923, injured idle[4] 2905/2906/2908/2910, block[4] 2969/2972x3, then 6 rows of block-hit [2970, 2973x3]. flags_hi 0x2000 overrides with 3245/3246 (3253/3254 when 0x4000 too). dist is the float third argument; 350/355 thresholds at 0x800E7F40.., its meaning is not traced."

[[func]]
addr = 0x800C3C6C
name = "grapple_anim_attacker"
desc = "Starts the attacker's grapple-lock animation for the GrappleCtx bits: HOLD 2936, REAR 2940, CORNER 2944, DEF_ON_APRON 2948, ATK_ON_APRON 2952, STRENGTH_TEST 2957, MUTUAL 2934."
status = "confirmed"

[[func]]
addr = 0x800C421C
name = "grapple_anim_defender"
desc = "Defender's grapple-lock animation, the attacker's id + 1 (2937, 2941, 2945, 2949, 2953, 2958, 2935)."
status = "confirmed"

[[func]]
addr = 0x800C46EC
name = "grapple_timeout"
desc = "The grapple input window: counts state_timer down; returns 1 when the attacker presses A/B/C-down (from behind A/B, plus L/R in some match types; stored in g_grapple_input) or the special input, 2 when the window runs out (plays the break animation 2938/2942/2946/2950/2954; the defender follows with id + 1), 0 otherwise."
status = "likely"

[[data]]
addr = 0x800E6F40
name = "g_base_anims"
type = "s16[44]"
desc = "Animation table of wrestler_base_anim: walk, idle, injured walk, injured idle, block, block-hit rows of 4 (by stance style or body region)."
status = "confirmed"

[[data]]
addr = 0x800F05A0
name = "g_injury_region"
type = "s8[4]"
desc = "Per wrestler slot: body region (0-3) whose condition wrestler_base_anim checks for the injured idle/walk; set by move_apply_hit when the targeted region becomes the weakest (body_parts.md)."
status = "confirmed"

[[data]]
addr = 0x800F19C8
name = "g_climb_kind"
type = "s16[4]"
desc = "Per slot: how the wrestler mounts the turnbuckle; state_09_turnbuckle plays animation 3012 + this. Set from header bytes 17-22 or constants 0/2/4/5."
status = "likely"

# --- placing two wrestlers for a move; see animation_states.md "Where the partner stands" ---

[[func]]
addr = 0x8009FB94
name = "vec_xz_dist_angle"
proto = "void vec_xz_dist_angle(f32 *from, f32 *to, f32 *out)"
desc = "out = {dx, xz distance, dz, angle (s32, 0x1000 per turn)} from 'from' to 'to'; out may be NULL."
status = "confirmed"

[[func]]
addr = 0x800A000C
name = "point_at_offset"
proto = "void point_at_offset(f32 *origin, f32 *offset, s32 angle, f32 *out)"
desc = "out.xz = origin.xz + offset (x, z) rotated by angle: x' = x*cos + z*sin, z' = z*cos - x*sin. With offset (0, d) this is the point d away in direction angle."
status = "confirmed"

[[func]]
addr = 0x800A2490
name = "wrestler_translate"
proto = "void wrestler_translate(struct Wrestler *w, f32 *delta)"
desc = "Moves a wrestler by delta in x and z: pos and both world joint sets."
status = "confirmed"

[[func]]
addr = 0x800A57D8
name = "wrestler_slide_to"
proto = "void wrestler_slide_to(struct Wrestler *w, f32 *target, s16 frames)"
desc = "Sets the per-frame slide velocity at +0x32C/+0x334 that brings the pelvis (joints[0]) to target in 'frames' frames."
status = "likely"

[[func]]
addr = 0x800A3390
name = "ground_approach_plan"
desc = "Plans the attacker's walk to the spot next to a downed opponent chosen by state_33 (fills a 48-byte record at 0x800F0730 + slot*48)."
status = "guess"

[[func]]
addr = 0x800CD894
name = "ai_learn_strike_reach"
proto = "void ai_learn_strike_reach(struct Wrestler *w)"
desc = "At the hit frame of a strike or ground attack (slots 4-6, 122-128, 154, 155), averages the distance from the attacker's pos to the joint that hits into a per-wrestler table at 0x800F1870 (8 categories x 8 bytes)."
status = "guess"

# --- animation frame events (file 618 bytes 16-31); see file_formats/animations.md ---

[[func]]
addr = 0x8000DE1C
name = "sound_play_event"
proto = "void sound_play_event(s16 slot, s16 code)"
desc = "Plays a sound on the wrestler's 3-voice channel. code < 256 is a sound id; code >= 256 is an animation sound event (code - 256): looked up in the event tables at 0x8002D86E (sound id), 0x8002D907 / 0x8002D953 (two play parameters) and 0x8002D9B7 (grunt category), with floor substitutions and crowd events 45-63 routed to crowd_sound_play."
status = "likely"

[[func]]
addr = 0x8000DB2C
name = "crowd_sound_play"
proto = "void crowd_sound_play(s16 id)"
desc = "Plays a sound on the shared (non-wrestler) 3-voice channel at 0x80057488; ids 1025-1044 map through a table at 0x8002D204."
status = "likely"

[[func]]
addr = 0x8000E5A4
name = "wrestler_grunt"
proto = "void wrestler_grunt(s16 voice_set, s8 a, s8 b, s8 c)"
desc = "Queues the wrestler's own voice sample (voice set 0x800F1848[slot] - 1) for a grunt category 1-6 of an animation sound event."
status = "guess"

[[func]]
addr = 0x8000E1B8
name = "wrestler_voice_sound"
proto = "s16 wrestler_voice_sound(s16 slot, s16 k)"
desc = "Sound id of the wrestler's own call k (0 or 1) from the per-roster table at 0x8002E670 (two s16 per wrestler, -1 = none); used by frame events 190/191."
status = "confirmed"

[[func]]
addr = 0x800103B0
name = "ring_rope_push"
proto = "void ring_rope_push(s16 kind, s16 side, f32 along)"
desc = "Starts a rope deflection on one ring side at a position along it (clamped to +-180): kind 1-11 picks which of the 3 ropes (0x80058600 + side*120 + rope*40) move, by how much (+-10) and over how many frames (6/12). Frame events 200-219."
status = "likely"

[[func]]
addr = 0x8000FF08
name = "rope_anim_set"
desc = "Fills one rope's deflection record: position, start/end offsets and per-frame steps over n frames."
status = "likely"

[[func]]
addr = 0x800101F0
name = "rope_attach"
proto = "void rope_attach(s16 slot, s16 limb, s16 side, s16 rope)"
desc = "Records that a wrestler's limb holds or stands on rope 'rope' (0 bottom .. 2 top, from the order of the turnbuckle climb) of ring side 'side' (table 0x800587E0, 4 sides x 3 ropes); frame events 221-239."
status = "likely"

[[func]]
addr = 0x8000B7CC
name = "rope_release"
proto = "void rope_release(s16 slot, s16 limb)"
desc = "Releases a limb's rope attachment (per-slot tables at 0x8004AAB0 rope / 0x8004AAD0 side); frame events 220/230 (all hands/feet) and 240-243."
status = "likely"
