[[func]]
addr = 0x800A54B0
name = "wrestler_set_state"
proto = "void wrestler_set_state(struct Wrestler *w, s16 state)"
desc = "Sets state, clears state_step and _unk350, clears some flag bits."
status = "confirmed"

[[func]]
addr = 0x800A5D70
name = "ring_zone_of"
proto = "s16 ring_zone_of(struct Vec3 *pos)"
desc = "Classifies a position into a ring zone (in ring, apron, floor...)."
status = "guess"

[[func]]
addr = 0x800AD7EC
name = "state_42_attack_move"
proto = "void state_42_attack_move(void)"
desc = "Attacker side of a grapple move (part 0): kept snapped to the receiver, hit on move_frames_left == 1, then move_followup; swaps to 0x43 at the reversal frame when the receiver is REVERSING (grapples.md)."
status = "likely"
notes = "Reversal path: if opponent flags_lo & 0x80000 and _unk006 == anim_player[14], takes part 1 of the opponent's move and switches to state 0x43."

[[func]]
addr = 0x800ADA38
name = "state_43_receive_move"
proto = "void state_43_receive_move(void)"
desc = "Receiver side of a grapple move (part 1); takes the lead (0x42) when the attacker gets REVERSAL_ATTACKER; at the end neutral by pose and move_aftermath_check."
status = "likely"

[[func]]
addr = 0x800A6F54
name = "wrestler_end_move"
proto = "void wrestler_end_move(struct Wrestler *w)"
desc = "Called when move_frames_left reaches 0."
status = "guess"

