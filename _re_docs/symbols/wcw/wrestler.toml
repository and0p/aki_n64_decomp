[[func]]
addr = 0x8000C6A0
name = "blood_apply"
proto = "void blood_apply(s16 slot)"
desc = "Paints blood into the textures of mesh parts 5 (head), 4 (neck) and 3 (chest; another mask for some costumes): sets texels chosen by 1-bit masks at 0x8002DA30 to the last palette entry and makes that entry red (0xF801). Skipped when the blood option byte 0x80061FEF is set."
status = "likely"

[[func]]
addr = 0x8000C260
name = "tex_paint_mask"
proto = "void tex_paint_mask(void *part, u32 *mask, u16 color)"
