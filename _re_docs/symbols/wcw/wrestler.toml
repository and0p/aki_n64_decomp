[[func]]
addr = 0x800A08D4
name = "wrestler_spirit_tick"
proto = "s16 wrestler_spirit_tick(struct Wrestler *w, s16 op)"
desc = "Spirit timers. op 0 reset; 1 every 120 ticks drift spirit toward 50 (+3 below 31, +2 below 50, -1 above 50), set SPIRIT_EMPTY at 0 and SPECIAL at 100; 2 count down SPECIAL (900) and SPIRIT_EMPTY (300), then spirit = 50; 3 a hit while SPECIAL takes 60 off its timer; 4 returns the SPECIAL timer."
