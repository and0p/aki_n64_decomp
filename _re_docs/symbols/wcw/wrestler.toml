# Per-wrestler state and update (ovl_b).
# Struct: types.h Wrestler. Notes: _re_docs/individual_games/wcw_world_tour/match_state.md

[[func]]
addr = 0x800A7C80
name = "wrestler_update"
proto = "void wrestler_update(void)"
desc = "Per-wrestler tick: sets the g_cur_* pointers, clears per-tick flags, updates ring_zone, then calls g_state_handlers[state]."
status = "confirmed"

[[func]]
addr = 0x800A0860
name = "wrestler_add_spirit"
proto = "void wrestler_add_spirit(struct Wrestler *w, s16 delta)"
desc = "Adds delta to spirit, clamped to 0..100; does nothing while flags_lo & 0x1800."
status = "confirmed"

