[[enum]]
name = "WrestlerState"
desc = "Values of Wrestler.state seen so far."
values = { STAND = 0x01, RUN = 0x03, RUNNING_ATTACK = 0x07, TURNBUCKLE = 0x09, WHIP_ATTACKER = 0x0A, WHIP_RUNNER = 0x0B, WHIP_CTX_ATTACKER = 0x0C, WHIP_CTX_RUNNER = 0x0D, WALK = 0x16, STRIKE = 0x1D, GROUND_ATTACK = 0x23, RECOVER = 0x27, APRON = 0x29, PICKUP_ATTACKER = 0x2D, PICKUP_DEFENDER = 0x2E, COVER_ATTACKER = 0x2F, COVER_DEFENDER = 0x30, PIN_ATTACKER = 0x31, PIN_DEFENDER = 0x32, HOLD_ATTACKER = 0x35, HOLD_DEFENDER = 0x36, BLOCK = 0x39, STANCE = 0x3B, GET_UP = 0x3C, GRAPPLE_ATTEMPT = 0x3D, GRAPPLE_ATTACKER = 0x3E, GRAPPLE_DEFENDER = 0x3F, ATTACK_MOVE = 0x42, RECEIVE_MOVE = 0x43, MOVE_FAIL_ATTACKER = 0x46, MOVE_FAIL_DEFENDER = 0x47, ROPES_A = 0x54, ROPES_B = 0x55, APRON_RECOVER = 0x56, DIVE_OUTSIDE = 0x57, REAR_L_ATTACKER = 0x64, REAR_L_DEFENDER = 0x65, CARRY_ATTACKER = 0x66, CARRY_CARRIED = 0x67, CROWD_WEAPON = 0x6F, TAG_IN = 0x71, TAG_OUT = 0x72, TAG_REACH = 0x73 }
notes = "Only states with a known role are listed; each handler carries its own status (sym.py show state_XX_...). Pairs are usually attacker = even, defender = odd. All 120 handlers: states.toml."

[[func]]
addr = 0x800B4178
name = "wrestlers_update_all"
proto = "void wrestlers_update_all(void)"
desc = "Updates every wrestler once per frame, starting at g_update_first: first grapple leaders (flags_lo & GRAPPLE_LEAD) followed by their linked_idx partners, then everyone not yet updated, then anyone flagged RERUN; then attached pairs are synced and g_update_first rotates."
status = "confirmed"

[[func]]
addr = 0x800B47D4
name = "wrestler_tick"
proto = "void wrestler_tick(void)"
desc = "Updates g_wrestlers[g_cur_index]: reads its pad (human) or runs the AI (CPU) into g_input_*, calls wrestler_update until RERUN clears, sets the anim window flag and marks it UPDATED."
status = "confirmed"

[[func]]
addr = 0x800B5780
name = "ai_think"
proto = "void ai_think(void)"
desc = "CPU opponent decision for g_cur_index; result is read from g_ai[slot] as if it were pad input. Repeats while RERUN is set."
status = "confirmed"

[[func]]
addr = 0x800A553C
name = "wrestler_set_state_now"
proto = "void wrestler_set_state_now(struct Wrestler *w, s16 state)"
desc = "wrestler_set_state plus flags_lo |= RERUN, so the new state runs again in the same frame."
status = "confirmed"

[[data]]
addr = 0x800F1714
name = "g_ai"
type = "u8[4][84]"
desc = "Per-slot CPU state (84 bytes). +2/+4 are fed to g_input_held/g_input_pressed and +8 to g_input_far when the slot is CPU-controlled."
status = "confirmed"

[[enum]]
name = "WrestlerFlagsLo"
desc = "Bits of Wrestler.flags_lo."
values = { CPU = 0x1, LEGAL = 0x2, LOC_RING = 0x4, LOC_APRON = 0x8, LOC_FLOOR = 0x10, SPIRIT_EMPTY = 0x800, SPECIAL = 0x1000, SPECIAL_POSED = 0x2000, RUNNING = 0x4000, FACE_DOWN = 0x8000, BACK_HIT = 0x800000, REVERSAL_ATTACKER = 0x40000, REVERSING = 0x80000, CAN_REVERSE = 0x100000, RERUN = 0x1000000, UPDATED = 0x2000000, GRAPPLE_LEAD = 0x4000000, ATTACHED = 0x10000000, TEAM_B = 0x20000000, BLEEDING = 0x40000000 }
notes = "Confirmed: CPU (wrestler_tick picks AI vs pad), RERUN, UPDATED (wrestlers_update_all), REVERSING (set by grapple_check_reversal, read by state_42). LOC_* are set together by wrestler_apply_anim_location (ring/floor heights confirmed; LOC_APRON is a guess, it is also checked by match phase 3). SPIRIT_EMPTY (spirit hit 0; spirit frozen for 300 ticks, then reset to 50) and SPECIAL (spirit hit 100; lasts 900 ticks, each hit taken removes 60, damage dealt x1.2, health reads health_max) are confirmed from wrestler_spirit_tick and move_apply_hit. LEGAL (the wrestler who is in the match in tag team; set on both in singles; countout_tick only counts these in tag matches) and TEAM_B (set on both members of the second team) are confirmed from snapshot 9. Guesses: CAN_REVERSE, GRAPPLE_LEAD, ATTACHED (pair is synced by sub_800A5658 / wrestler_turn_toward), BLEEDING."

[[enum]]
name = "GrappleCtx"
desc = "Bits of Wrestler.grapple_ctx, read by grapple_choose_move."
values = { SPECIAL_READY = 0x1, STRONG = 0x2, CATCH_RUNNER = 0x4, REAR = 0x8, CORNER = 0x10, DEF_ON_APRON = 0x20, ATK_ON_APRON = 0x40, HOLD = 0x80, DT_FRONT = 0x100, DT_REAR = 0x200, DT_MIXED = 0x400, DT_SIDE_A = 0x800, DT_SIDE_B = 0x1000, APRON_REACH = 0x2000, FLOOR_TO_APRON = 0x4000, FLOOR_TO_RING = 0x8000, STRENGTH_TEST = 0x10000, MUTUAL = 0x40000, SPECIAL_ALLOWED = 0x80000 }
notes = "STRONG/REAR/CORNER confirmed against the slot tables and the FAQ. SPECIAL_* (slot 58 front / 69 rear special needs 0x1|0x2|0x80000), DEF_ON_APRON/ATK_ON_APRON (unknown positions, maybe apron or ropes; slots 105/106 and whip states 12-15) and HOLD (required for any grapple move) are inferred. The grapple animation pickers (grapple_anim_attacker etc.) give one animation set per bit: HOLD front 2936-2939, REAR 2940-2943, CORNER 2944-2947, DEF_ON_APRON 2948-2951 and ATK_ON_APRON 2952-2955 (Andrew tagged these as grapples between the apron and the ring, so DEF_ON_APRON/ATK_ON_APRON are probably the two apron/ropes cases), STRENGTH_TEST 2957/2958 (test of strength, states 0x40/0x41), MUTUAL 2934/2935 (untagged). See individual_games/wcw_world_tour/animation_states.md."

[[func]]
addr = 0x800A1C98
name = "wrestler_apply_anim_frame"
proto = "void wrestler_apply_anim_frame(struct Wrestler *w)"
desc = "Per-frame animation side effects: facing += anim.yaw_delta, copies anim.pose_class to +0x038, then wrestler_apply_anim_location. Called by 87 functions (nearly every state)."
status = "likely"

[[func]]
addr = 0x800A1D00
name = "wrestler_apply_anim_location"
proto = "void wrestler_apply_anim_location(struct Wrestler *w)"
desc = "Sets the location bits of flags_lo from the animation's location class (anim._unk06): 1 -> LOC_RING with pos.y = 90, 2 -> LOC_FLOOR with pos.y = 0, 3 -> LOC_APRON? with pos.y = 90."
status = "confirmed"

[[func]]
addr = 0x800A56E0
name = "wrestler_turn_toward"
proto = "void wrestler_turn_toward(struct Wrestler *w, s32 target, s32 max_step)"
desc = "Turns facing toward target by at most max_step per call; on arrival snaps to target and ORs a flag word (stack argument) into flags_lo/flags_hi."
status = "likely"

[[enum]]
name = "WrestlerFlagsHi"
desc = "Bits of Wrestler.flags_hi."
values = { IN_ANIM_WINDOW = 0x4, HOLDING_WEAPON = 0x2000, WEAPON_ALT = 0x4000 }
notes = "IN_ANIM_WINDOW is set by wrestler_tick while anim.window_start <= anim_frame <= anim.window_end (window meaning not yet known). HOLDING_WEAPON: set on the wrestler holding a bat in snapshot 9; wrestler_base_anim then uses the weapon idle/walk 3245/3246, or 3253/3254 with WEAPON_ALT (also set there; probably the weapon type)."

# --- health and spirit timers (found 2026-10-30 while naming Wrestler fields) ---

