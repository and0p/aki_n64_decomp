status = "likely"

[[func]]
addr = 0x80098194
name = "result_announce"
proto = "void result_announce(u32 result)"
desc = "Picks the result banner (0x800ED628: 0 pinfall, 1 submission, 2 count-out, 3 TKO, 4 time limit, 5 double count-out, 6 draw) and rings the bell (sub_80098ACC 3/5/7/11)."
status = "likely"

[[func]]
addr = 0x80099D40
name = "results_screen"
proto = "void results_screen(s16 margin)"
desc = "Post-match results (90 frames after the decision): per-slot winner (1 << slot) and loser (16 << slot) bits of g_match_result, and the result margin."
status = "likely"

[[func]]
addr = 0x800B3400
name = "match_init_wrestlers"
desc = "Per-wrestler match start: health and region conditions from g_match_results, injury region, AI setup (ai_init_slot, ai_learn_reset), clears links."
status = "confirmed"

[[data]]
addr = 0x800F05B0
name = "g_ring_kickouts"
type = "s16[4]"
desc = "Kick-outs per slot in the ring: state_32_pin_defender adds 1 when a kicked-out pin ends while LOC_RING. Below 2 caps the pin kick-out difficulty at 87 (automatic kick-out). Seen 1 after the first kick-out in RAM (aki_debug, 2026-10-31)."
status = "confirmed"
