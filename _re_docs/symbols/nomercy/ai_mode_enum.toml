# One-line notes for the enum entries, where the name needs help.
[notes]
0 = "The neutral mode: ai_choose_mode runs every frame until another mode is set."
1 = "Close to the opponent: with chance = skill, reacts to what it is doing."
2 = "May detour first, as against a dazed opponent."
4 = "Lines up on a ring side and runs in."
7 = "Holds R for 1-13 frames."
9 = "Presses B, and prepares the next strike during it."
10 = "C-down with a direction from ai_evade_direction."
15 = "Tag and partner decisions; picks another mode."
16 = "Waits while the opponent runs, then acts as it arrives."
25 = "Waits a time from the style tables, then picks."
26 = "Works through a list of move and input pairs from ai_lockup_moves."
27 = "Goes straight back to Think."
28 = "Goes straight back to Think."
29 = "Presses A, B, L and R at once, with a chance from skill."
30 = "Being whipped: A or B with a chance from skill."
31 = "In a hold: steers toward the nearest ropes."
33 = "Holds the d-pad toward the ring centre."
36 = "C-down then C-up toward an area: going through the ropes."
38 = "Runs ai_stick_taunt unless the meter is in a mode, then Think."
39 = "Walks to a point; in the steps zones presses C-left: the steps or a weapon."
47 = "Reads the diving opponent's move and holds R on a timer."
50 = "As ApronWait, with SPECIAL."
51 = "C-down, then a move by ai_mode_50_apron_wait_taunt's choice."
52 = "Held while approaching a downed opponent (state 0x36)."
53 = "With a skill chance presses B, R or similar at a dazed, knocked-back or off-balance opponent."
54 = "At the get-up's step 2 decides what to do as it rises."
56 = "Walks away when the opponent dives at the corner it is near."
60 = "25-42 frames in a d-pad direction by its ring zone and slot."
67 = "Runs at an opponent being carried, or a dazed one (ai_try_run_at_dazed_opponent)."
73 = "C-left by whether the opponent lies face up or down (73-76 share a function)."
77 = "C-left or B by mode (77-81 share a function)."
82 = "Walks up, then acts (82-85 share a function)."
86 = "A quarter turn round the opponent, then BlockDive."
87 = "Walks to the opponent's zone axis when in a different zone."
89 = "Lines up along x and z before acting, at a lying or dazed opponent."
92 = "To a ring corner while the opponent is down; it may then dive."
94 = "L at a slumped opponent, setting it on the turnbuckle (state 0x3C)."
95 = "Strike 30%, RunAtOpponent by a trait, else waits."
96 = "As ApproachDownedOpponentAndAct, the last press by the angle (96-99 share a function)."
100 = "L at an opponent on the ropes (state 0x97)."
105 = "A run with a move at its end, from a table entry (105-109 share a function)."
109 = "As RunWithMove, A with reach 160."
113 = "With SPECIAL or finisher mode, by the current animation."
117 = "Holds a direction and reacts to the opponent's situations 20-31."
119 = "Holds the d-pad while running; a rebound keeps it."
123 = "Walks to the opponent's zone edge, then C-right."
131 = "R when the height difference is small."
132 = "Holds B while in state 0xCC."
133 = "Ladder match: heads for object 6."
135 = "Ladder match: object 6 stands; goes to it and climbs."
139 = "Ladder match: object 6 is free; goes for it."
141 = "Around a crowd-weapon grab on the floor; walks by quadrant."
144 = "Elimination: after its own fall, goes for the wrestler still in."
