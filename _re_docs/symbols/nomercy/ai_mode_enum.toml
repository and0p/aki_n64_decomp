# Names for the enum of CPU AI modes (ai_mode::Id), one per entry of g_ai_modes (0x80145A10). The functions and what
# is known about them are in ai.toml. tools/decomp/gen_states.py writes src/nomercy/nm_ai_mode_ids.h from this file.
# Most names come from reading the code. [recorded] lists the modes some recording actually runs; a mode outside it
# is marked as such on its enum entry, and its name describes what the code does rather than anything seen in play.
