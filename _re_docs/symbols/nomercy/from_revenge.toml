[[func]]
addr = 0x800135D0
name = "anim_decode_joint"
proto = "const u8 *anim_decode_joint(const u8 *src, struct Vec3 *rot, struct Vec3 *pos)"
desc = "Decodes one joint of a keyframe (code 2026-11-02, decompiled in src/nomercy/nm_model.cpp): a big-endian word with three 10-bit angles (bits 0-9 x, 10-19 y, 20-29 z, each x 0.3515625 degrees); bit 31 adds a position: bit 30 clear a word of sign-magnitude units (x bits 0-10, y 11-21, z 22-31) that also becomes the last absolute position (0x80069F10), bit 30 set three sign-magnitude bytes x 0.5 added to that last absolute position. Returns the next source byte. As Revenge anim_decode_joint (0x8000A6C0), matched by call graph."
status = "confirmed"
port = "src/nomercy/nm_model.cpp"

[[func]]
addr = 0x80013860
name = "anim_frame_events"
proto = "void anim_frame_events(s32 slot, s32 frame)"
desc = "Fires the animation's (frame, event) byte pairs (file 703 record bytes 20-35, eight pairs) whose frame equals `frame` (code 2026-11-02, decompiled in src/nomercy/nm_model.cpp): 1-169 sfx_play_slot(slot, 0x100 + code) when 0x8009EDD4 is set; 170-175 anim_event_special; 176-195 anim_hand_pose_set(code - 176); 200-219 a rope push: kind from 0x80047F20[code - 200] (6 is dropped when joint 1's world z >= 280, 10 when the drawn y is 0; 6 becomes 12 when z >= 230), the side from joint 1's world x / z by diagonal halves, corrected to the side the body faces (quarter turns from the block's yaw; kind 9 takes that quarter + 3), ring_rope_push(kind, side, the x or z along it); 220-243 the ropes: 220 / 230 release limbs 1-3 / 5-7, 240-243 release the limb in 0x80047F20[20 + k], 221-229 / 231-239 limb (k - 1) / 3 + 1 (hands) or (k - 11) / 3 + 5 (feet) takes rope 2 - (k - 1) % 3 on the side of its joint's world point (0x80047F38[limb]), recorded in 0x8006A228 (rope) and 0x8006A248 (side). As Revenge anim_frame_events (0x8000ACE4), matched by call graph."
status = "confirmed"
port = "src/nomercy/nm_model.cpp"

