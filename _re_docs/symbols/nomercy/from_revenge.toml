[[func]]
addr = 0x80012130
name = "model_animate"
proto = "void model_animate(s32 slot, s32 anim, s32 frame, struct Vec3 *pos, s32 facing, const struct Vec3 *lean, s8 mode, s32 tilt_a, s32 tilt_b)"
desc = "Poses a wrestler's model for frame `frame` of animation `anim` (full read, code 2026-11-02, decompiled in src/nomercy/nm_model.cpp). A change of animation (or a restart at frame 0) reopens the stream (anim_stream_open: keyframes DMA'd from the ROM 98 bytes at a time into two heap buffers), lets go of the ropes and clears the hand shape; then, when the frame is new, decodes it (model_decode_frame on even frames and the last; model_decode_frame_interp halfway to the next keyframe on odd ones; anim_stream_advance at frame count - 2), blends frames 0-4 of a new animation from the previous pose with mode bit 2 (model_blend_prev; not on a restart, nor the slot's first animation), writes the head-look lean into joint 5 (x + 180, y, z = 180), builds the skin matrices (model_build_skin). With mode bit 1 on a switch the body is moved so that joint 1's world point stays where the old animation left it (x and z; y too with bit 8): the root's place is recomputed under the old translation and the new pose through nodes 0 and 1. Then the model block's translation (-pos.x, pos.y + the carry offset 0x800A9352 for slot 0x8009FDE0 - 1, pos.z) and yaw (-(facing + 2048) * 360 / 4096 degrees), the body matrix (scale x (tilt(x, 0, z) x yaw) + translation) into render node 0's local matrix, node_tree_update over the tree, each joint's world points (pt_a / pt_b through the node's world matrix, x mirrored) and its yaw (rot.y + the body's), and the frame's events (anim_frame_events, frame + 1). The stream's `first` byte (anim_system_init) is cleared at the end. As Revenge model_animate (0x80008CE8), matched by call graph (score 1.44). Revenge: Matches World Tour model_animate (0x80009D00), call-graph score 1.15."
status = "confirmed"
port = "src/nomercy/nm_model.cpp"
notes = "Port: partial (paths the traces have not reached yet stop a replay with NM_UNPORTED)."

