name = "guest_referee_call"
desc = "The guest referee's C-left call (from state_01_stand / 0x1B; only for the guest-referee slot, flags_e9 0x04): with no other wrestler busy it marks a wrestler's fall (end_flags 0x200) or, for an illegal act (flags8c 0x1000 / 0x2000), a disqualification (end_flags 0x400, the same bit strike_dq_check sets); then the referee's own call animation (0x8D-ish states by weapon). Carried over from Revenge as move_apply_hit, which did not fit. From code 2026-11-02."
