name = "chance_roll"
proto = "s32 chance_roll(struct Wrestler *w, struct Wrestler *other, s32 kind)"
desc = "The odds behind most contests: picks a chance per mille by kind, then chance_check. Tables (Rev 1 data): 0 by spirit (100: 500, 81: 333, 61: 250, 31: 125, 11: 62, else 31; ground_grapple_defend); 1 a spirit table at 0x8014620E doubled / quadrupled by situation and attrs +0x34 & 0x1000 (grapple_defender_input: the grapple reversal); 2 by health_eff (>= 196: 3.9, 128: 7.8, 64: 15.6, 32: 31.25, else 62.5); 3 by spirit (100: 1000, 81: 500, 61: 333, 31: 250, 11: 200, else 125; whip reversals, 0x04, 0x15); 4 bleeding: 1000 / (15 - the defender's (other) attrs +2 - the move's bleed_class - the attacker's (w) spirit / 30); 5 the TKO stagger when the defender's (other) health_eff < 25 (move_aftermath_check passes (attacker, defender); checked 2026-11-02): by the move's tko_class (0x80146270: 16 / 133 / 166 / 222 / 333 / 666; move_aftermath_check); 6 the TKO recovery per press: 1000 / (0x80146288[attrs +7] (17 / 17 / 12 / 8) + 6 x (tries - 1)); 7 by health and (100 - spirit) / 40 (getting up from 0x31); 8 500 - 10 * max(0, other.spirit - w.spirit) (move reversals, reversal_check); 9 crowd weapon (by attrs +6); 10 lifting (1000 in finisher mode, else by the size difference attrs +0x15 / 3 and the other's health, table 0x8014628C); 11 by spirit (100: 600, 80: 400, 60: 300, 40: 200, else 100; resisting a pick-up); 12 by the escape counter +0xB4 (>= 120: 100, 60: 125, 45: 166, 30: 222, 15: 333, else 666); 13 700; 14 500; 15 600; 16-18 100 x byte +0xE4 (knockdown falls, strike_land); 19 10 x (0x8014631C[ladder_rung] (0, 10, 20, 30, 40, 30) + other's spirit / 5 - own spirit / 5; knocked off a ladder, 0xB2). Capped at 1000."
status = "likely"

[[func]]
addr = 0x80116AC4
name = "match_clock_tick"
desc = "The match clock (g_match_minutes / seconds, 30 frames a second). Each minute after 10 with run-ins on (g_match_rules 0x200) it rolls chance_check(500) (250 once under g_match_type 0x400000) to arm both sides' run-ins. With a time limit (byte 0x8009FE6C indexes 60 / 5 / 10 / 15 / 30 / 60 minutes at 0x80146574) it shows the clock (counting down under g_match_rules 0x80000) and at the limit either flags the end (g_match_type 0x2000000: ironman?) or ends the match (sub_80117438(0x8000): a time-limit draw). Called countout_tick from the World Tour match, which was wrong."
status = "likely"

[[func]]
addr = 0x8012835C
name = "grapple_walk"
proto = "void grapple_walk(struct WrestlerCtx *ctx, s32 *pair)"
desc = "Moving while grappled (from the lock-up, state 0x51 step 2): after the d-pad is held 7 frames (aux_timer) state_counter 0x02 turns walking on, for normal standing grapples (flags78 0x800). A direction within about 20 degrees of the facing (or of its back) walks both wrestlers that way, keeping the pair distance; otherwise both turn 45 units (about 4 degrees) a frame toward it, sliding the opponent round. keep_in_bounds_pair keeps them in the ring. The pair record (g_grapple_pairs) holds the distance: 73.5 front, 53.5 rear."
status = "likely"

[[func]]
