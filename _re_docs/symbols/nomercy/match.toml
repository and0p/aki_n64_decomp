status = "likely"

[[func]]
addr = 0x80112074
name = "apply_damage"
proto = "void apply_damage(struct Wrestler *att, struct Wrestler *def)"
desc = "Applies the move in def->hit_move (read from the disassembly). D = hit_move +0x06 (or +0x1B when def+0x31E equals the nonzero s16 hit_move +0x1C; then flags8a 0x4000 is set), r = hit_move +0x0B (region), k = hit_move +0x0C (kind). Damage = max(0, trunc((wrestler_region_condition(att, r) + 50) * D * 0.01)) + max(0, (att.attrs[0x0A + r] - def.attrs[0x0F + k]) * D / 10) + max(0, (att.spirit - def.spirit) / 20, only when D != 0); x1.2 when the attacker is in finisher mode (flags_ee 0x04). Then wrestler_add_health(def, -damage, mode) with mode 1 in states 0x45 / 0x49 / 0x4B, 2 with hit_move flags 0x8000000, else 0; damage_history_add; health_max -= damage / 4 (at least 1 when D != 0; not below 64; skipped with 0x8000000); each of the five regions drops by hit_move +0x12 + i (more in a submission 0x49, from the two wrestlers' attrs +0x16 classes through the float table 0x801461C0); the weakest region index goes to +0xE7 when r is it (r != 4); then spirit_exchange."
status = "confirmed"

[[func]]
addr = 0x8011241C
name = "escape_time"
desc = "Time values (frames) by op, read from the disassembly (the decompiler drops the result). Op 1, the pin escape time (w = the pinned wrestler, other = the pinner): 95 + other.spirit / 5 + finisher bonus (10 / 15 / 20 / 25 for finisher_heat up to 15 / 30 / 45 / more, table 0x801461E4) + 2 * w.pin_count (pins taken so far) - (w.spirit / 3 + w.health / 2) + max(0, damage_history_ratio - 15); if that is 90 or more and w.spirit is 90 or more it becomes 87. The referee counts once per 30 frames, so 90 frames is a three count: below 90 the wrestler kicks out (the pin state also takes 1-3 more off per mash and keeps at least 15). Op 0, the time down after a knockdown (state_31_down): 0 in finisher mode; else 3 * finisher_heat + 180 - (health + spirit) / 2 - 80 * down_count, where down_count already includes this knockdown and counts 2 fewer after a finisher (the attacker's flags8c 0x04, moves 70 / 81), and finisher_heat is set to 180 by a finisher (flags8c 0x800); scaled in tag matches on the floor / apron (0x80150968 / 0x80150970); below 0 means up at once. Example: the first knockdown at 100 health / 20 spirit gives 180 - 60 - 80 = 40 frames; a finisher on the same wrestler gives 540 + 180 - 60 + 80 = 740. Ops 2 and 9: 100 - (spirit / 2 + health / 4). Op 3 (state_49_ground_held): 60 in finisher mode, else the op 6 formula. Op 4: 180 - (spirit / 2 + health / 4) under a match condition (0x80162A80 & 1, 0x8016B594 >= 6). Op 5 (state_80_carried_escape) and op 6 (state_82_carried), w carried by other: (200 or 300 + other.spirit / 2 - (w.spirit / 4 + w.health)) / 2. Op 7 (state_34): (100 - (w.spirit / 2 + w.health / 4)) x 4, x 8 with w's flags78 0x04. Op 10 (state_C6, state_CA, the cage / turnbuckle family): (100 - (spirit / 2 + health / 4)) x 4. Callers: op 0 state_31_down, state_63_hit_while_down, state_70_over_ropes; 1 state_45_pin_defender; 2 state_56_move_defender, state_3F, state_18_corner_slump; 3 state_49_ground_held; 4 state_15; 9 state_17. Every op except 1 and 3 is 0 in finisher mode (flags_ee 0x04). Negative results become 0."
status = "likely"

