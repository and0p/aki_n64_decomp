[[func]]
addr = 0x80116CDC
name = "match_end"
proto = "int match_end(u16 cause)"
desc = "Ends a fall for one end_flags cause (from match_tick); returns 1 when it acted (code, 2026-11-02). Cause to result code: 0x08 pin -> 0x4000, 0x20 submission -> 0x2000, 0x40 TKO -> 0x10000, 0x10 out over the top -> 0x80000, 0x100 last one standing -> 0x800, 0x200 guest referee call -> 0x800000, 0x400 DQ -> 0x20000, 0x800 ladder -> 0x40000, 0x1000 cage escape -> 0x2000000. 0x800: the first slot with the flag clears it and is recorded as the winner (match_record_fall with 0x800 | 0x400). 0x800000: match_result(0x800000) and the bell, ending the whole match. 0x80000: needs every wrestler with flags_e9 0x10 to be out (end_flags 0x01, or not in the ring / apron and not flags_f1 0x01 or state 0xA3); records stats and a fall for each flagged wrestler (saving end_flags at +0x90), then match_result; with elimination (g_match_type 0x4000 and rules bit 20, or g_match_type 0x400000) slot 0's fall ends it outright. The rest: for each flagged loser, saves and clears the flag; under g_match_rules 0x80000 it adds to the fall count (fall_count_add; for DQ the wrestler at +0x6C) instead; otherwise tag_partner_takes_over decides whether the fall ends the match (match_record_fall with 0x400, then match_end_start unless the cage escape) or play goes on."
status = "likely"

