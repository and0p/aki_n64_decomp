[[func]]
addr = 0x800F03F0
name = "ai_update"
proto = "void ai_update(s32 slot)"
desc = "Per-slot CPU update from wrestler_tick: sets the AI globals (0x8016B8E8 self, 0x80159618 opponent, 0x8016B92C partner, 0x8016B71C partner's opponent, 0x8016B720 opponent's partner, 0x8015A6F0 the slot's 176-byte AI block in g_ai_blocks), refreshes perception (ai_update_perception), stores the situation classes (ai_situation: own in +0x24, the opponent's in +0x48), distances to the four ring corners (+0x6C), ring zones (+0x42 / +0x54), and copies ten personality bytes of the wrestler's attribute record (attrs +25, +26, +30, +31, +34-+39) into AI globals (0x80159624, 0x80159510, 0x80162A78, 0x8015A6F4, 0x80159980, 0x8016B590, 0x8016B9E1, 0x8016B93C, 0x8016B9E0, 0x8016B9CE); they are trait levels that index chance arrays in g_ai_mode_tables. Readings from where each is used (guesses): +25 / +26 how to treat a downed opponent (healthy / hurt), +30 / +31 which move list (by the opponent's health), +34 grapple keenness (ai_try_grapple, far decisions, turnbuckle), +35 defence and counters (kick catch, apron reactions, runners, wait or engage), +36 close-range aggression and struggling, +37 overall aggression (used in 18 decisions), +38 weapons and fighting outside (armed checks, the floor, count-outs; 3 a special weapon behaviour), +39 specials and finishers (SPECIAL, taunts, special moves); then runs the current mode from g_ai_modes. Mode 0 stays in state 0x03 / 0x04 at most 150 frames. ai_set_mode (0x800FCEB4) changes the mode."
status = "likely"

