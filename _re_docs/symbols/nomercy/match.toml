desc = "Lock-up time limit: counts count_timer down (R alone, in_0c & 0xC030 == 0x10, or sub_800ED9C4 sets it to 0); when it runs out it plays the release animation (11907 front / 11911 rear, 11915 / 11919 on a staggered opponent, 11923 / 11927 on the apron) and returns how the lock-up continues."
status = "likely"

