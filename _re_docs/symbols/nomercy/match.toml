desc = "Which breakable tables still stand: 0x04 the place at location 0x40, 0x08 at 0x100, 0x10 at 0x200 (code, 2026-11-02). Climbing on (state_6F) needs the bit; finisher_effects clears it when a finisher lands there (sound 51, crowd flash or pyro, arena_zones_swap 2 / 3 / 4) and sets 0x8009FE68 0x40 for the first one. Set at match_load."
status = "likely"

[[func]]
addr = 0x80114514
name = "match_tick"
proto = "void match_tick(void)"
desc = "The match's per-frame step, a switch on the phase word 0x801591FC (0-4) (code, 2026-11-02). Phase 0: set-up (buffers, g_match_minutes and the flag blocks cleared, results_screen(0), objects_cleanup, match_init_wrestlers), then a 30-frame wait (0x801591E0) and phase 1, where wrestlers without a roster entry or with flags_e9 0x02, and run-ins (state 0xA3), are hidden. Play: match_frame_extras instead when 0x80162A7C bit 1 (paused?); otherwise run_in_check, wrestlers_update_all(1), referee_count_tick, match_clock_tick (non-zero ends the frame), countout_tick(2) (non-zero ends the frame), then match_end for one cause a frame in this order: 0x08 pin, 0x40 TKO, 0x20 submission, 0x10 over the top, 0x100 last one standing, 0x200 guest referee call, 0x400 DQ, 0x800 ladder, 0x1000 cage escape (the first that acts ends the frame), then match_events."
status = "likely"

[[func]]
addr = 0x801166B8
name = "countout_tick"
proto = "int countout_tick(int op)"
desc = "The count-out (code, 2026-11-02; was results_screen from the World Tour match, which did not fit). Op 0: count-outs on (g_countout bit 0) when the option byte 0x800A9462 is not 0. Op 1: restarts the count: counts left (0x8016B594) from the option (table 0x80146568: 0 / 10 / 20), number shown (0x8016B578) 0, clears g_countout bit 1, hud_countout_show. Op 2, every frame from match_tick: with count-outs on, in the ring arenas (g_arena < 10), if any wrestler in play (flags_e9 0x10) is off the ring and apron (location & 3 == 0) and match_can_interrupt is 0: with no counts left it is a count-out (the bell; under g_match_rules 0x80000 fall_count_add for each wrestler outside, otherwise match_result(0x80000)); else, outside guest-referee matches and while no pin count runs (0x80159204 == -1), the clock 0x801591EC ticks in seconds and each count comes after 2 seconds (4 or more left), 3 (3-5 left) or 4 (fewer than 3), op 3. With everyone back in, op 1 restarts the count. Op 3: the next number (shown + 1, left - 1, hud_countout_number) and g_countout bit 1 once counting started."
status = "likely"

