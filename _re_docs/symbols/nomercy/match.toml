[[func]]
addr = 0x800F0EF0
name = "ai_choose_mode"
desc = "The CPU's main decision, run from AI mode 0. (1) Focus: in multi-wrestler matches a worn-down CPU (hits taken in hurt states, +0x5E, re-rolled 0-7) switches to the nearest opponent attacking it (AI block +0x80 0x04 / 0x08). (2) Unless its situation is STANDING or 43, it only reacts: in states 3 / 4 for 151+ frames it stops (+0x0E 3840), on a ladder it goes to mode 136 or 138. (3) Standing: with g_arena < 10 it calls the decider for the where-class (+0x82, from both locations): ai_decide_in_ring, _ring_vs_floor, _apron_vs_floor, _apron_vs_ring, _floor_vs_ring, _apron_vs_apron, _vs_turnbuckle, _turnbuckle_vs_ring, _turnbuckle_vs_turnbuckle, _floor; backstage (g_arena >= 10) ai_decide_backstage; then the raised-place deciders (location 0x3C0); ai_think only under g_match_type 0x100000; mode 144 under g_match_type 0x4000 when its end_flags has 0x01. (4) Unless g_match_rules 0x2000, when the opponent's situation is 15-20 (down) and sub_800FCAFC agrees it presses C-left."
status = "likely"

[[func]]
addr = 0x800F559C
name = "ai_can_act"
desc = "1 when the CPU's wrestler can start something now: standing (state 0x01), state 0x0A with +0xF4 bit 2, or state 0x4F at step 2 (getting up done); sets AI block +0x0E = 1 then. Called by ai_choose_mode, ai_think and several modes."
status = "likely"

[[func]]
addr = 0x800FD6DC
name = "ai_perceive"
proto = "f32 ai_perceive(f32 value, f32 cap)"
desc = "The CPU's noisy reading of a value: error e = value * (1 - skill / 1000), at most value * cap; returns value + e * (r / 1000 - 0.5) for a random r (rand_pool_next), not below 0. So a skill-1000 CPU reads exactly and a skill-100 one is off by up to 45%. Read from the disassembly (the decompiler drops the arguments). Used by ai_update_perception for health, spirit, distances, regions and time down."
status = "confirmed"

[[data]]
addr = 0x80145298
name = "g_ai_mode_tables"
type = "u8[0x6C8]"
desc = "The CPU's weighted mode tables (ai_pick_mode_weighted: 6-byte entries {cumulative chance /1000, mode, u8, u8 +0x80 bits}), 0x80145298-0x80145960. Tables found and their users (chance:mode): 0x80145298 ring vs floor 45:41 45:45 10:32; 0x801452F4 in ring 30:6 10:9 30:1 10:2 10:41 10:32; 0x80145318 / 0x80145330 / 0x80145348 in-ring variants (39 fetch weapon, 41 approach, 45 back off, 48 approach downed); 0x801453CC 40:44 40:86 20:41; 0x8014543C apron / ring 20:6 20:1 60:2; 0x8014548A 99:32; 0x801454C8 floor vs ring 35:41 10:32 15:33 15:34 25:39; 0x80145574 floor vs ring 23:6 25:9 10:44 20:41 20:32; 0x801455BA, 0x8014561A, 0x80145650, 0x80145668 (sub_800F6D30 / 0x800F6FA4); 0x801456AC-0x80145740 (0x800F7318-0x800F75A8); 0x80145794 40:41 50:39 10:45; 0x801457B2 20:41 15:32 55:39; 0x80145958 vs turnbuckle 45:86 45:45 10:55. Decoded by a scan of the data (tables start after a 1000 entry)."
status = "likely"

[[func]]
addr = 0x80131C40
name = "walk_speed"
proto = "f32 walk_speed(struct Wrestler *w, s32 flags)"
desc = "Movement speed per frame, read from the disassembly. Speed class = attrs +0 (1-3), lowered by one for each threshold the legs' condition (region 3) is below: class 1 [10], class 2 [30, 10], class 3 [30, 10] (tables at 0x8014DB90 / 0x8014DB98 / 0x8014DBA4). Speeds by class 0-3 (0x8014DBB0, pairs {fast, normal}): {4.5, 3.4}, {5.25, 3.7}, {6.0, 4.0}, {6.75, 4.3}. Returns normal, or fast with flags & 1. Flags: 0x08 doubles both; 0x10 / 0x20 set fast to 1.5; on the apron (location 0x02) flags 0x02 -> 3.0, 0x08 -> 12.0; 0x40 -> 8.0 (each of these only matters with flags & 1). As Revenge walk_speed (0x800D63F0)."
status = "confirmed"

[[func]]
addr = 0x8012069C
name = "strike_hit_test"
proto = "s32 strike_hit_test(struct Wrestler *att, s32 obj, s32 kind)"
desc = "Whether a strike (or thrown object, kind 24) connects; returns the target slot (or 100 + object), -1 for none. Only inside the move's active window (anim_frame between anim_player +8 and +9) unless kind 24. Candidates come from hit_candidates; for a wrestler the height window runs from its lowest joint plus a per-slot offset (0x8016B778 + 112 * slot), for an object from its y + 126. By kind: strike kinds 1, 3, 17-19, 21, 22, 24-27, 29, 30 (and 5-16, 28, 31 with another joint list) need the two wrestlers' joint 0 within 460, then each attacking joint of the move's joint list (move +0x0D test_kind indexes the lists at 0x80146844, up to 3 joints; the weapon tip for kinds 3 / 24) is tested against the target's joints 5 and 1 (list 0x8014689C): distance <= the per-slot joint radii (0x8016B728 + 112 * slot) and the joint's height inside the window. Kinds 2 / 4: the current opponent in the same place (location & 0x3C5); 20 / 23: any wrestler. As Revenge strike_hit_test (0x800C2CDC), read from the code and data 2026-11-02."
status = "likely"

[[func]]
addr = 0x801269DC
name = "grapple_attempt_resolve"
proto = "void grapple_attempt_resolve(struct Wrestler *att, struct Wrestler *def)"
desc = "What a grapple attempt that reached def does (from code 2026-11-02). From behind (relative_position bit 0x08): flags78 0x80, a rear grapple. A defender swinging a weapon (state 0x1B) loses 10 spirit. No grapple on a lying wrestler (flags80 0x08) or one held by someone else. The defender drops any weapon. A defender in the air (states 121-125, 149 step 3, +0xF4 bits 0x0F) is caught when the attacker is in the ring and not running: pair 0x88 / 0x89. Not rear: a defender in the L evade (state 0x6B) with count_timer 4 or less (a 5-frame window) and both in the same place deflects it: 0x6C / 0x6D, or against a running grapple the defender counters: it takes 0x5B (with move 90) and the runner 0x5C; timed_press_check kind 3 can also deflect. Two simultaneous attempts (the defender in 0x50 step 4 before frame 3) give flags78 0x200000. A defender in the pick-up 0x34 with frame_flags 0x08 in the ring: 0x40 / 0x41. From the floor at the apron: grapple_start_pair. Otherwise, unless a double team takes over (grapple_double_team_check), grapple_start_pair. With flags78 0x08 (a staggered target): 0x5B / 0x5C, or with 0x1000 a double-team lock-up with slot_d."
status = "likely"

[[func]]
addr = 0x8012CB8C
name = "keep_in_bounds"
desc = "Keeps a wrestler (or a pair) out of the arena's collision geometry (from code 2026-11-02). The wrestler's radius is half its joint spread, or 30 on raised places (location 0x340) and in state 0x49 step 1. The collision set is the state's override (Wrestler +0x350, cleared by wrestler_set_state) or by location: ring 0x80146BF0; apron by ring zone (table 0x8014D390); floor by ring zone and area (0x8014D290 + 16 * (g_arena - 9 for backstage, else 0)); 0x40 0x80147E20; 0x80 0x8014BC8C; 0x100 0x8014B704; turnbuckle (0x400) by zone (0x8014D3A0); otherwise 0x8014C500. Each set is a list of triangle lists tested with run_step_corner (really a segment / triangle test); the nearest hit pushes the wrestler back. As Revenge keep_in_bounds (0x800D2CAC)."
status = "likely"

[[func]]
addr = 0x8012906C
name = "grapple_defender_input"
proto = "void grapple_defender_input(struct Wrestler *def, struct Wrestler *att, u16 pressed)"
desc = "The held wrestler's one reversal try per lock-up (flags_f0 0x08 marks it used), only while it is in finisher mode or the attacker is not. Any of A / B / L / R pressed (wrestlers with attrs +0x34 0x1000 always count as pressing) rolls chance_roll kind 1; success sets flags_f0 0x04, which grapple_reversal_start turns into the reversal. Kind 1 (exact): spirit 100 / 81 / 61 / 31 / 11 / below: 500 / 333 / 250 / 125 / 62 / 31 per mille, doubled when the defender is the bigger wrestler (attrs +0x15 / 3 higher), and against a strong grapple x4 at health_eff 192+ or x2 at 128+; wrestlers with attrs +0x34 0x1000 use kind 8 instead (500 - 10 * spirit deficit). From code 2026-11-02."
status = "confirmed"

[[func]]
addr = 0x801112F0
name = "run_collide"
desc = "What a running wrestler hits (from code 2026-11-02). Another runner (flags80 0x20): both bounce into 0x05, or from the apron both are knocked down (0x2D). A blocker facing it (0x4C / 0x4D): runner 0x05, blocker 0x4D at step 2. With a charged run (flags8a 0x20): a wrestler slumped in the corner (0x18) is knocked down (0x2D, hit flags 4) while the runner bounces (0x05); one with frame_flags 0x10 goes over the ropes (0x70); one on a ladder is knocked off (0xB2) and the runner is knocked down 10% (0x2D) or back 90% (0x35). run_target_downed 1: the runner dodges (0x9F). From the apron into a standing wrestler: both knocked down. Otherwise the run goes on (state 3, step 3). Objects in the way are pushed (object_set_motion); a charged run into a ladder (type2 25) tips it and knocks the runner down or back. As Revenge run_collide (0x800B5340)."
status = "likely"

[[func]]
addr = 0x8011C5AC
name = "lockup_place_move"
desc = "From the lock-up (C-down / C-up through lockup_input; World Tour's push_apart by call graph, a name that did not fit): outside cage matches, aims the whip direction (whip_direction) and checks the zone in front (zone_info): facing a feature (zone_info +0x28 bit 0x80) with ring-edge zones 1-4 it starts 0x0D / 0x0E (unless in the ring under g_match_rules 0x400); zones 29-54 (the announce table areas) or 25-27 start 0x0F / 0x10 (putting the opponent onto the table / steps; state_counter 0x02 / 0x04); a zone with flags +0x26 0x20 starts 0x0D / 0x0E (0x10); returns 1 / 2 for the caller's whip choice (2 -> 0xD0 / 0xD1)."
status = "likely"

