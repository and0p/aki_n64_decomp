# The animation stream and the model's matrices (main segment), read in full for the decompilation
# (src/nomercy/nm_model.cpp, 2026-11-02); the stream layout is struct AnimStream in types.h.

[[func]]
addr = 0x80011340
name = "anim_stream_fetch"
proto = "void anim_stream_fetch(s32 slot, s32 wait)"
desc = "Fetches the next keyframe of the slot's animation stream (code 2026-11-02, decompiled in src/nomercy/nm_model.cpp): nothing when bytes_left is 0; else starts a PI DMA of min(98, bytes_left) bytes from rom_next into buf[cur_buf] (OSIoMesg at +0x88 + 24 * cur_buf, reply queue +0x58 + 24 * cur_buf, osEPiStartDma retried until accepted), waits for the fetch before it when dma_pending (osRecvMesg on the other queue), then cur_buf ^= 1, dma_pending = 1, rom_next += n, bytes_left -= n. So after a call buf[cur_buf] is the keyframe fetched the time before and the other buffer is being filled. anim_stream_open calls it with priority 1, anim_stream_advance with 0."
status = "confirmed"
port = "src/nomercy/nm_model.cpp"

[[func]]
addr = 0x80012B24
name = "anim_stream_advance"
proto = "void anim_stream_advance(s32 slot)"
desc = "Moves the stream on one keyframe (code 2026-11-02, decompiled in src/nomercy/nm_model.cpp): with bytes left anim_stream_fetch(slot, 0) (which also waits for the pending fetch and makes its buffer current); at the end of the file, when a fetch is pending, waits for it and makes its buffer current (dma_pending = 0). Called by model_decode_frame_interp before decoding (odd frames) and by model_animate at frame count - 2."
status = "confirmed"
port = "src/nomercy/nm_model.cpp"

[[func]]
addr = 0x80013EB0
name = "ropes_release_all"
proto = "void ropes_release_all(s32 slot)"
desc = "rope_release for limbs 0-7 of the slot: every hand and foot lets go of the ropes when an animation starts (model_animate) (code 2026-11-02, decompiled in src/nomercy/nm_model.cpp)."
status = "confirmed"
port = "src/nomercy/nm_model.cpp"

[[func]]
