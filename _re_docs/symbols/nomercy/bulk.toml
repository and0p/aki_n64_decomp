addr = 0x80015D8C
name = "model_nodes_build"
desc = "Builds a slot's render nodes (220 bytes each) from the model record: nodes 1-19 and 22-24 (mesh, texture slot, chained to the next node), the face (20) and slot 21; then the seams (sub_8000D284, fixed pairs: 1 (14, -), 22 (14, 7), 2 / 23 (3, 1), 3 (5, -), 5 (3, -), 6 (7, 8), 13 (14, 15), 11 (12, 9), 16 (19, 17)) and the shoulder / arm offsets (+-5, +-7)."
status = "likely"

[[func]]
addr = 0x8000D284
name = "mesh_split_seam"
desc = "Seam skinning: the part's first header[3] >> 4 vertices load with node a3's matrix, the next header[3] & 15 with node a2's (0 = none), the rest with the part's own node (a0)."
status = "likely"

[[func]]
addr = 0x8000C58C
name = "node_setup_part"
desc = "Sets up a render node with a mesh part (mesh_part_load), its texture slot and display list, and links it (+0 / +4 / +8)."
status = "likely"

[[func]]
addr = 0x8000C398
name = "mesh_part_load"
desc = "Loads a mesh part file into a part record: +6 flag bit, +2 vertex count, +1 triangle count, +4 / +5 the seam counts (header[3] nibbles), then builds vertices and triangles."
status = "likely"

[[func]]
addr = 0x80132C30
name = "mash_count"
desc = "Mash counter (code 2026-11-02). op 0 resets; op 1 counts a press of A / B / L / R only when the per-slot cooldown (0x80159440, +1 a frame) is 2 or more (presses at least 2 frames apart), up to a threshold by state: 8 in 0x47, in the pin 0x45 / 0x4B by the referee's count (2 at 0, 1 at 1, every press at 2), else 4; returns 2 below it, 1 / 3 / 4 when reached (one, two, three steps: at count 2 three once 16+ frames into the count). op 2 counts raw presses (0x80159430), op 3 returns them."
status = "likely"

[[func]]
addr = 0x80017160
name = "anim_hand_pose_set"
desc = "Frame events 176-195 (and model_animate): sets the slot's hand pose 0-19 (byte 0x80076588[slot]); the model swaps the meshes of parts 17 / 18 / 9 / 10 (the hands) by tables 0x8004847C-0x800484B8 (code 2026-11-02, animation_data.md)."
status = "likely"

[[func]]
addr = 0x800172D4
name = "anim_event_special"
desc = "Frame events 170-174 (code - 170): 1 / 2 call sub_80013FFC(0, +-0.25, 1); 3 / 4 copy a 2,056-byte per-slot buffer (0x80076CF8 / 0x80076CFC) into the model texture area, a texture swap (code 2026-11-02)."
status = "likely"
