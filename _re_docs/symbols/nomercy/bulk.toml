name = "mtx_rotate_joint"
proto = "void mtx_rotate_joint(f32 *m, f32 ax, f32 ay, f32 az)"
desc = "The joints' rotation matrix from three Euler angles in degrees (row vectors), the same convention as World Tour's mtx_rotate_xyz (0x80008BD0; the call-graph match of that name here, 0x80035D50, is a different function, not checked): row 0 (cz cy, sz cx + cz sy sx, sz sx - cz sy cx), row 1 (-sz cy, cz cx - sz sy sx, cz sx + sz sy cx), row 2 (sy, -cy sx, cy cx) (code 2026-11-02, decompiled in src/nomercy/nm_model.cpp). model_build_skin uses it for every joint."
