[[func]]
addr = 0x8012888C
name = "lockup_input"
desc = "The attacker's choice in the lock-up, from the latched buttons (ctx in_0c) and the d-pad (from code 2026-11-02). A or B starts a grapple move: front from the table 0x801469D0 [strong][B][dir] with dir 0 none, 1 left / right, 2 up, 3 down: weak A 1 / 2 / 3 / 4, weak B 5 / 10 / 15 / 20, strong A 25 / 30 / 35 / 40, strong B 45 / 50 / 55 / 60; rear from 0x801469F0 [strong][B][any dir]: 73-80. With finisher mode ready (flags78 0x400000) and a strong grapple: move 70 (front) / 81 (rear), the finisher; A+B in a strong grapple: 70 / 81 on the partner's slot in tag (double-team finisher). L in a front lock-up: 0x3E / 0x3F (turn to a rear grapple). C-down: the whip (lockup_place_move: 0x0B / 0x0C, or 0xD0 / 0xD1). C-up: lockup_place_move kind 1. Cage matches: C-right whips into the cage (flags78 0x10000000). Running grapples: move 145 (0x240) or 108 / 130 (0x140). A defender who can reverse (attrs +0x34 0x1000) against a move without flags 0x2000: moves 159 / 161. Then grapple_reversal_start."
status = "confirmed"

[[func]]
addr = 0x80128F5C
name = "grapple_reversal_start"
desc = "Starts the defender's reversal of a grapple move (from code 2026-11-02): when the defender's flags_f0 has 0x04 and the attacker's move is reversible (move flags 0x01). Rear lock-up: move 162 when the defender can counter (attrs +0x34 0x1000), else 85 (strong; flags78 = 4) or 84; on the apron (flags78 0x200 / 0x400): 148 / 152; front: flags_f0 0x02 and the defender plays the move's own reversal (move_anim_offset). Counts it in the stats (stats_count kind 1)."
status = "confirmed"

