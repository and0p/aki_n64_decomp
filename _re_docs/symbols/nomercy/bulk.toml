[[func]]
addr = 0x8012F660
name = "move_event"
proto = "void move_event(struct WrestlerCtx *ctx, u16 ev)"
desc = "The end of a move's or state's animation (code 2026-11-02; called by nearly every state, 145 callers): does nothing until anim_frames_left < 2, then by the bits of its argument: 0x40 applies generic move (0x8014DB00[ev & 0x3F]) to the opponent; 0x2000 applies the current move's damage to the opponent, or with 0x4000 the opponent's to itself (hit_move_copy, apply_damage); 0x400 tries move_chain_check (a chain returns 1 at once); 0x80 counts a statistic (kind ev & 0x3F; 0x100 for the opponent); then always anim_end_apply and wrestler_unpair; 0x200 wrestler_settle_pose, with 0x800 also move_aftermath_check (on the opponent, or itself with 0x1000); otherwise state 0x30 (flags8e 0x40 kept). Returns 1 when the animation ended."
status = "likely"

[[func]]
addr = 0x800ECEEC
name = "move_chain_check"
desc = "After a grapple move: when the animation ends in pose 6 and the move has no follow-up (move +4 == 0) both wrestlers go back to the lock-up (0x51 at step 2, flags78 0x880 plus the strong bit): grapple moves that chain into another grapple."
status = "likely"

